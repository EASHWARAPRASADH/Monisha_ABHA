ivr.welcome=அரசு மருத்துவமனை வெளிநோயாளி பிரிவு டோக்கன் முன்பதிவு சேவைக்கு நல்வரவு.
ivr.language.select=ஆங்கிலத்திற்கு 1, தமிழிற்கு 2, இந்திக்கு 3 ஐ அழுத்தவும்.
ivr.main.menu=டோக்கன் முன்பதிவு செய்ய 1, டோக்கன் ரத்து செய்ய 2, தேதி மாற்ற 3, பணியாளரிடம் பேச 4, ஏஐ மருத்துவ உதவிக்கு 5 ஐ அழுத்தவும்.
ivr.ai.prompt=ஏஐ மருத்துவ வழிகாட்டி: உங்கள் அறிகுறிகளை கூறவும், அல்லது நெஞ்சு வலிக்கு 1, மூட்டு வலிக்கு 2, காய்ச்சலுக்கு 3, குழந்தை நோய்க்கு 4, தோல் நோய்க்கு 5, காது மூக்கு தொண்டைக்கு 6 அழுத்தவும்.
ivr.ai.recommendation=உங்கள் அறிகுறிகளின் அடிப்படையில் எங்கள் ஏஐ {0} பிரிவை பரிந்துரைக்கிறது. டோக்கன் உறுதி செய்ய 1, வேறு துறைக்கு 2 அழுத்தவும்.
ivr.ai.emergency=உடனடி எச்சரிக்கை: மருத்துவ அவசர நிலை அறிகுறிகள் கண்டறியப்பட்டன. உடனடியாக அவசர சிகிச்சை பிரிவு செல்லவும் அல்லது 108 அழைக்கவும். பணியாளருக்கு 0 அழுத்தவும்.
ivr.patient.recognized=நல்வரவு {0}. உங்கள் அலைபேசி எண் சரிபார்க்கப்பட்டது.
ivr.patient.enter.abha=தயவுசெய்து உங்கள் 14 இலக்க ஆபா எண்ணை உள்ளிட்டு ஹாஷ் அழுத்தவும். புதிய பதிவுக்கு 0 அழுத்தவும்.
ivr.patient.not.found=இந்த எண்ணிற்கு பதிவு செய்யப்பட்ட நோயாளி தகவல் எதுவும் கிடைக்கவில்லை.
ivr.otp.sent=சரிபார்ப்புக் குறியீடு உங்கள் அலைபேசிக்கு அனுப்பப்பட்டது. தயவுசெய்து 6 இலக்க OTP ஐ உள்ளிடவும்.
ivr.otp.invalid=தவறான சரிபார்ப்புக் குறியீடு. மீண்டும் முயற்சிக்கவும். {0} வாய்ப்புகள் உள்ளன.
ivr.otp.exhausted=அனுமதிக்கப்பட்ட வாய்ப்புகள் முடிந்தது. பின்னர் மீண்டும் அழைக்கவும்.
ivr.hospital.select=மருத்துவமனையை தேர்வு செய்யவும்: அரசு பொது மருத்துவமனைக்கு 1, அரசு மாவட்ட மருத்துவமனைக்கு 2, அரசு சமுதாய மையத்திற்கு 3 ஐ அழுத்தவும்.
ivr.department.select=துறையை தேர்வு செய்யவும்: பொது மருத்துவத்திற்கு 1, இதய சிகிச்சைக்கு 2, எலும்பு சிகிச்சைக்கு 3, தோல் நோய்க்கு 4, காது மூக்கு தொண்டைக்கு 5, குழந்தைகள் நலனுக்கு 6 அழுத்தவும்.
ivr.token.success=உங்கள் டோக்கன் எண் {0}. உத்தேச நேரம் {1}. டோக்கன் விவரங்கள் SMS மூலம் அனுப்பப்பட்டுள்ளது. நன்றி.
ivr.token.unavailable=இன்று இந்த துறையில் டோக்கன்கள் எதுவும் இல்லை. வேறு துறைக்கு 1, வேறு மருத்துவமனைக்கு 2, பணியாளரிடம் பேச 3, முடிக்க 4 அழுத்தவும்.
ivr.token.duplicate=இன்றைய தேதியில் ஏற்கனவே உங்களிடம் டோக்கன் {0} உள்ளது. ஒரே நாளில் மற்றொரு டோக்கன் பதிவு செய்ய முடியாது.
ivr.token.opd.closed=இன்றைய ஓபிடி முன்பதிவு முடிந்துவிட்டது. காலை 8 முதல் மாலை 4 வரை இயங்கும்.
ivr.cancel.prompt=தயவுசெய்து உங்கள் டோக்கன் எண்ணை உள்ளிட்டு ஹாஷ் அழுத்தவும்.
ivr.cancel.not.found=செயலில் உள்ள டோக்கன் எதுவும் கிடைக்கவில்லை.
ivr.cancel.success=உங்கள் டோக்கன் {0} வெற்றிகரமாக ரத்து செய்யப்பட்டது. உறுதிப்படுத்தல் SMS அனுப்பப்பட்டுள்ளது.
ivr.reschedule.prompt=புதிய துறையை தேர்வு செய்யவும். பொது மருத்துவத்திற்கு 1, இதய சிகிச்சைக்கு 2, எலும்புக்கு 3, தோலுக்கு 4, காது மூக்குக்கு 5, குழந்தைகளுக்கு 6 அழுத்தவும்.
ivr.reschedule.success=உங்கள் டோக்கன் மாற்றப்பட்டது. புதிய டோக்கன் எண் {0}, உத்தேச நேரம் {1}.
ivr.officer.transfer=மருத்துவமனை உதவி மையத்திற்கு இணைக்கப்படுகிறது. தயவுசெய்து காத்திருக்கவும்.
ivr.error.invalid.input=தவறான தேர்வு. மீண்டும் முயற்சிக்கவும்.
ivr.error.timeout=உள்ளீடு பெறப்படவில்லை. அழைத்தமைக்கு நன்றி.
ivr.goodbye=அரசு மருத்துவமனை சேவைக்கு நன்றி. நல்வாழ்வு வாழ்த்துகள்.
