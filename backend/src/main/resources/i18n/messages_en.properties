ivr.welcome=Welcome to the Government Hospital OPD Token Booking Service.
ivr.language.select=For English, press 1. Tamilukku, press 2. Hindi ke liye, press 3.
ivr.main.menu=Press 1 to book an OPD token. Press 2 to cancel a token. Press 3 to reschedule a token. Press 4 to speak to hospital staff. Press 5 for AI symptom department triage.
ivr.ai.prompt=AI Clinical Assistant: Please speak your symptoms, or press 1 for chest pain, 2 for joint or knee pain, 3 for fever or cough, 4 for child illness, 5 for skin rash, 6 for ear nose throat.
ivr.ai.recommendation=Based on your symptoms, our local AI recommends {0} department. Press 1 to confirm and book token. Press 2 to choose a different department.
ivr.ai.emergency=CRITICAL ALERT: Your symptoms indicate an urgent emergency. Please visit Hospital Casualty immediately or dial 108. Press 0 to connect to emergency staff.
ivr.patient.recognized=Welcome {0}. Your mobile number has been verified.
ivr.patient.enter.abha=Please enter your 14 digit mock ABHA number followed by hash, or press 0 to register as new caller.
ivr.patient.not.found=No registered patient record was found for this number.
ivr.otp.sent=A verification code has been sent to your mobile. Please enter your 6 digit OTP.
ivr.otp.invalid=Invalid verification code. Please try again. {0} attempts remaining.
ivr.otp.exhausted=Maximum OTP verification attempts exceeded. Please try calling again later.
ivr.hospital.select=Please select a hospital: Press 1 for Government General Hospital. Press 2 for Government District Hospital. Press 3 for Government Community Health Centre.
ivr.department.select=Please select a department: Press 1 for General Medicine. Press 2 for Cardiology. Press 3 for Orthopaedics. Press 4 for Dermatology. Press 5 for ENT. Press 6 for Paediatrics.
ivr.token.success=Your token number is {0}. Your estimated consultation time is {1}. Your token details have been sent by SMS. Thank you.
ivr.token.unavailable=No tokens are currently available for this department today. Press 1 to select another department. Press 2 to select another hospital. Press 3 to speak to hospital staff. Press 4 to end the call.
ivr.token.duplicate=You already have an active OPD token {0} booked for today. You cannot book another token for the same day.
ivr.token.opd.closed=OPD token booking for today is closed. OPD timings are 8:00 AM to 4:00 PM. Please call tomorrow.
ivr.cancel.prompt=Please enter the numeric part of your token number followed by the hash key.
ivr.cancel.not.found=No active token found matching the number you provided.
ivr.cancel.success=Your token {0} has been successfully cancelled. A confirmation SMS has been sent.
ivr.reschedule.prompt=Please select a new department for your appointment. Press 1 for General Medicine, 2 for Cardiology, 3 for Orthopaedics, 4 for Dermatology, 5 for ENT, 6 for Paediatrics.
ivr.reschedule.success=Your token has been rescheduled. Your new token number is {0} and estimated time is {1}.
ivr.officer.transfer=Connecting you to the hospital helpdesk executive. Please stay on the line.
ivr.error.invalid.input=Invalid input. Please try again.
ivr.error.timeout=We did not receive any input. Thank you for calling Government Hospital Service. Goodbye.
ivr.goodbye=Thank you for calling Government Hospital OPD Service. Have a healthy day.
