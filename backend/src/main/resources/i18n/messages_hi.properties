ivr.welcome=सरकारी अस्पताल ओपीडी टोकन बुकिंग सेवा में आपका स्वागत है।
ivr.language.select=अंग्रेजी के लिए 1, तमिल के लिए 2, हिंदी के लिए 3 दबाएं।
ivr.main.menu=ओपीडी टोकन बुक करने के लिए 1, टोकन रद्द करने के लिए 2, रीशेड्यूल के लिए 3, कर्मचारी से बात करने के लिए 4, एआई लक्षण मार्गदर्शन के लिए 5 दबाएं।
ivr.ai.prompt=एआई डॉक्टर सहायक: अपने लक्षण बताएं या सीने में दर्द के लिए 1, जोड़ों के दर्द के लिए 2, बुखार-खांसी के लिए 3, बच्चों के लिए 4, त्वचा रोग के लिए 5, कान-नाक-गले के लिए 6 दबाएं।
ivr.ai.recommendation=आपके लक्षणों के आधार पर हमारा एआई {0} विभाग की सिफारिश करता है। टोकन पक्का करने के लिए 1, दूसरा विभाग चुनने के लिए 2 दबाएं।
ivr.ai.emergency=आपातकालीन चेतावनी: गंभीर लक्षण पाए गए हैं। तुरंत अस्पताल की कैजुअल्टी में जाएं या 108 डायल करें। स्टाफ से बात करने के लिए 0 दबाएं।
ivr.patient.recognized=स्वागत है {0}। आपका मोबाइल नंबर सत्यापित हो गया है।
ivr.patient.enter.abha=कृपया अपनी 14 अंकों की आभा आईडी दर्ज करें और हैश दबाएं, या नए कॉलर के रूप में 0 दबाएं।
ivr.patient.not.found=इस नंबर पर कोई पंजीकृत मरीज नहीं मिला।
ivr.otp.sent=आपके मोबाइल पर 6 अंकों का ओटीपी भेजा गया है। कृपया ओटीपी दर्ज करें।
ivr.otp.invalid=अमान्य ओटीपी कोड। कृपया पुनः प्रयास करें। {0} प्रयास शेष हैं।
ivr.otp.exhausted=अधिकतम ओटीपी प्रयास समाप्त हो चुके हैं। कृपया बाद में प्रयास करें।
ivr.hospital.select=कृपया अस्पताल चुनें: सरकारी जनरल अस्पताल के लिए 1, जिला अस्पताल के लिए 2, सामुदायिक स्वास्थ्य केंद्र के लिए 3 दबाएं।
ivr.department.select=कृपया विभाग चुनें: जनरल मेडिसिन के लिए 1, कार्डियोलॉजी के लिए 2, ऑर्थोपेडिक्स के लिए 3, त्वचा रोग के लिए 4, ईएनटी के लिए 5, बाल रोग के लिए 6 दबाएं।
ivr.token.success=आपका टोकन नंबर {0} है। आपका अनुमानित समय {1} है। टोकन विवरण एसएमएस द्वारा भेजा गया है। धन्यवाद।
ivr.token.unavailable=आज इस विभाग के लिए कोई टोकन उपलब्ध नहीं है। अन्य विभाग के लिए 1, अन्य अस्पताल के लिए 2, कर्मचारी से बात करने के लिए 3, समाप्त करने के लिए 4 दबाएं।
ivr.token.duplicate=आज के लिए आपके पास पहले से एक सक्रिय टोकन {0} है। आप एक ही दिन के लिए दूसरा टोकन बुक नहीं कर सकते।
ivr.token.opd.closed=आज के लिए ओपीडी बुकिंग बंद हो चुकी है। ओपीडी का समय सुबह 8 से शाम 4 बजे तक है।
ivr.cancel.prompt=कृपया अपना टोकन नंबर दर्ज करें और हैश दबाएं।
ivr.cancel.not.found=इस नंबर पर कोई सक्रिय टोकन नहीं मिला।
ivr.cancel.success=टोकन {0} सफलतापूर्वक रद्द कर दिया गया है। पुष्टिकरण एसएमएस भेज दिया गया है।
ivr.reschedule.prompt=कृपया नया विभाग चुनें: जनरल मेडिसिन के लिए 1, कार्डियोलॉजी के लिए 2, ऑर्थोपेडिक्स के लिए 3, त्वचा रोग के लिए 4, ईएनटी के लिए 5, बाल रोग के लिए 6 दबाएं।
ivr.reschedule.success=आपकी अपॉइंटमेंट रीशेड्यूल हो गई है। नया टोकन नंबर {0} और समय {1} है।
ivr.officer.transfer=आपको अस्पताल हेल्पडेस्क से जोड़ा जा रहा है। कृपया लाइन पर बने रहें।
ivr.error.invalid.input=अमान्य इनपुट। कृपया पुनः प्रयास करें।
ivr.error.timeout=कोई इनपुट प्राप्त नहीं हुआ। कॉल करने के लिए धन्यवाद। अलविदा।
ivr.goodbye=सरकारी अस्पताल सेवा का उपयोग करने के लिए धन्यवाद। आपका दिन शुभ हो।
