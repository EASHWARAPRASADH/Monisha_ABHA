server:
  port: ${PORT:8088}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: hospital-ivr-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_ivr_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

app:
  demo-mode: ${DEMO_MODE:true}
  sms-provider: ${SMS_PROVIDER:mock}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:ACmock_account_sid_enterprise}
    auth-token: ${TWILIO_AUTH_TOKEN:mock_auth_token_secret}
    phone-number: ${TWILIO_PHONE_NUMBER:+18005550199}
  ivr:
    base-url: ${IVR_BASE_URL:http://localhost:8088}
    max-invalid-attempts: 3
    session-timeout-seconds: 600
  otp:
    expiration-minutes: 5
    max-attempts: 3
    fixed-mock-otp: ${FIXED_MOCK_OTP:123456}
  opd:
    start-time: "08:00"
    end-time: "16:00"
    slot-duration-minutes: 15
    default-daily-capacity: 50
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8088}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
